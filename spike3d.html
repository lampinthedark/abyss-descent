<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>spike3d</title>
  <style>
    @font-face {
      font-family: Silkscreen;
      src: url("assets/3d/fonts/Silkscreen-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #14120e;
      overflow: hidden;
      touch-action: none;
    }
    #view { width: 100%; height: 100%; display: block; }
    #bench, #tier, #tiers, #chat, #joy, #fail {
      position: fixed;
      font-family: Silkscreen, ui-monospace, monospace;
      color: #f3ead7;
    }
    #bench {
      top: 8px;
      left: 8px;
      z-index: 3;
      max-width: min(280px, 74vw);
      padding: 8px 10px 10px;
      background: rgba(10, 8, 6, 0.88);
      border: 2px solid #3a342c;
      font-size: 13px;
      line-height: 1.45;
    }
    body.bench #bench { font-size: 16px; max-width: min(420px, 92vw); }
    #bench b { color: #f6f1e4; font-weight: 400; }
    #bench .row { margin-top: 6px; }
    #bench button, #tiers button {
      font-family: inherit;
      font-size: 12px;
      color: #f3ead7;
      background: #2a241c;
      border: 2px solid #8a7a62;
      margin: 4px 4px 0 0;
      padding: 4px 6px;
    }
    #tier {
      top: 10px;
      right: 10px;
      z-index: 3;
      font-size: 15px;
      text-align: right;
      text-shadow: 0 2px 0 #000;
      pointer-events: none;
    }
    #tiers { top: 34px; right: 8px; z-index: 3; text-align: right; }
    #chat {
      left: 108px;
      right: 10px;
      bottom: 18px;
      z-index: 3;
      font-size: 13px;
      line-height: 1.45;
      text-shadow: 0 2px 0 #000;
      pointer-events: none;
    }
    #joy {
      left: 14px;
      bottom: 14px;
      z-index: 4;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(18, 14, 10, 0.42);
      border: 2px solid rgba(243, 234, 215, 0.55);
      touch-action: none;
    }
    #knob {
      position: absolute;
      left: 28px;
      top: 28px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(243, 234, 215, 0.88);
    }
    #fail {
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(12, 8, 6, 0.92);
      font-size: 14px;
    }
    body.bare #bench, body.bare #tier, body.bare #tiers, body.bare #chat { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/spike3d/vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bench"></div>
  <div id="tier">Rustbound</div>
  <div id="tiers">
    <button type="button" data-tier="1">1</button>
    <button type="button" data-tier="2">2</button>
    <button type="button" data-tier="3">3</button>
    <button type="button" data-tier="4">4</button>
    <button type="button" data-tier="5">5</button>
  </div>
  <div id="chat"><div id="chat0"></div><div id="chat1"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fail" hidden></div>
  <script type="module" src="js/spike3d/main.js"></script>
</body>
</html>
